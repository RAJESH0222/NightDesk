<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIGHT DESK · Global Markets — Zero-Budget Personal Terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23070f0c'/%3E%3Cpolyline points='4,22 10,16 15,19 22,9 28,13' fill='none' stroke='%23e8c46b' stroke-width='2.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/fontsource/css/unica-one@latest/latin-400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/css/ibm-plex-sans@latest/latin-400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/css/ibm-plex-sans@latest/latin-500.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/css/ibm-plex-sans@latest/latin-600.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/css/ibm-plex-mono@latest/latin-400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/css/ibm-plex-mono@latest/latin-500.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/css/ibm-plex-mono@latest/latin-600.css" rel="stylesheet">
<style>
:root{
  --bg:#070f0c; --ink:#e9f2ec; --mut:#8fa89b; --dim:#5d7268;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --up:#31d97f; --dn:#ff5c5c; --gold:#e8c46b; --cyan:#59d1e8; --mint:#a99fe0;
  --disp:'Unica One',sans-serif; --body:'IBM Plex Sans',sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;overflow-x:hidden}
/* layered ambient background */
body::before{content:'';position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(1000px 560px at 12% -8%, rgba(49,217,127,.10), transparent 62%),
    radial-gradient(900px 620px at 102% 108%, rgba(232,196,107,.08), transparent 60%),
    radial-gradient(700px 400px at 88% -6%, rgba(89,209,232,.06), transparent 60%),
    linear-gradient(180deg,#08110d,#070f0c 55%,#081009);}
body::after{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 56px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.022) 0 1px, transparent 1px 56px);}
::selection{background:rgba(232,196,107,.32)}
.mono{font-family:var(--mono)}
.wrap{max-width:1260px;margin:0 auto;padding:0 22px}
.hidden{display:none!important}
button{font-family:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.glass{background:linear-gradient(160deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 44px -26px rgba(0,0,0,.75)}

/* ---------- ticker tape ---------- */
.tape{border-bottom:1px solid var(--line);background:rgba(4,9,7,.72);overflow:hidden;white-space:nowrap;position:relative}
.tape::before,.tape::after{content:'';position:absolute;top:0;bottom:0;width:70px;z-index:2;pointer-events:none}
.tape::before{left:0;background:linear-gradient(90deg,var(--bg),transparent)}
.tape::after{right:0;background:linear-gradient(-90deg,var(--bg),transparent)}
.tape-track{display:inline-flex;align-items:center;padding:9px 0;animation:tapeMove 70s linear infinite;will-change:transform}
.tape:hover .tape-track{animation-play-state:paused}
@keyframes tapeMove{to{transform:translateX(-50%)}}
.tp{display:inline-flex;align-items:center;gap:8px;padding:0 18px;border-right:1px solid rgba(255,255,255,.07);font-family:var(--mono);font-size:11.5px}
.tp b{color:var(--ink);font-weight:600;letter-spacing:.06em}
.tp i{font-style:normal;color:var(--mut)}
.tp em{font-style:normal;font-weight:500}
.tp .u{color:var(--up)} .tp .d{color:var(--dn)}

/* ---------- masthead ---------- */
.mast{display:grid;grid-template-columns:1fr auto;gap:26px;align-items:end;padding:36px 0 20px;position:relative}
.mastart{position:absolute;right:180px;bottom:8px;width:420px;height:110px;opacity:.5;pointer-events:none}
.kicker{font-size:10px;letter-spacing:.26em;color:var(--gold)}
.mast h1{font-family:var(--disp);font-weight:400;font-size:clamp(2.9rem,6.6vw,4.8rem);letter-spacing:.05em;line-height:1;margin:10px 0 10px}
.mast h1 .hollow{color:transparent;-webkit-text-stroke:1.5px var(--gold)}
.subline{font-size:10.5px;letter-spacing:.2em;color:var(--dim)}
.mast-right{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch;position:relative;z-index:1}
.sess{min-width:158px;padding:11px 15px 12px}
.sess .lb{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--dim)}
.sess .tm{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:.04em;margin:3px 0 6px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9px;letter-spacing:.18em;padding:3px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--mut)}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.pill.open{color:var(--up);border-color:rgba(49,217,127,.5)}
.pill.open .dot{background:var(--up);box-shadow:0 0 8px var(--up);animation:blink 1.6s infinite}
.pill.closed{color:var(--dn);border-color:rgba(255,92,92,.4)}
.pill.closed .dot{background:var(--dn)}
@keyframes blink{50%{opacity:.3}}
.snap{padding:11px 15px 12px;border-color:rgba(232,196,107,.35)}
.snap .lb{font-family:var(--mono);font-size:9px;letter-spacing:.22em;color:var(--gold)}
.snap .tm{font-family:var(--mono);font-size:12px;margin:5px 0 7px;color:var(--ink);line-height:1.5}
.snap .tm .mode{color:var(--cyan)}
.rld{background:none;border:1px solid var(--line2);color:var(--mut);font-family:var(--mono);font-size:9px;letter-spacing:.14em;padding:4px 10px;border-radius:6px;cursor:pointer;transition:all .2s}
.rld:hover{color:var(--gold);border-color:var(--gold);transform:translateY(-1px)}

/* ---------- tabs ---------- */
.tabs{position:sticky;top:0;z-index:40;margin-top:6px;padding:6px 10px;display:flex;gap:2px;align-items:center}
.tab{font-family:var(--disp);font-size:14.5px;letter-spacing:.13em;color:var(--mut);background:none;border:0;padding:11px 18px 13px;cursor:pointer;transition:color .2s;position:relative}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--gold)}
.tab .cnt{font-family:var(--mono);font-size:9px;color:var(--cyan);vertical-align:super;margin-left:3px}
.tabline{position:absolute;bottom:7px;height:2px;background:var(--gold);box-shadow:0 0 12px rgba(232,196,107,.8);transition:left .38s cubic-bezier(.6,0,.2,1),width .38s cubic-bezier(.6,0,.2,1)}

/* ---------- panels ---------- */
.tabpanel{display:none;padding:24px 0 10px}
.tabpanel.active{display:block}
.sect-head{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.sect-head h2{font-family:var(--disp);font-weight:400;font-size:clamp(1.5rem,3vw,2.1rem);letter-spacing:.08em}
.sect-head .desc{color:var(--mut);font-size:13px;max-width:62ch}
.sig{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.2em;color:var(--gold);border:1px dashed rgba(232,196,107,.55);padding:6px 11px;border-radius:4px;margin-top:10px}

/* toolbar */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{flex:1;min-width:230px;position:relative}
.search input{width:100%;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:11px 14px 11px 38px;transition:border-color .2s, box-shadow .2s}
.search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,196,107,.12)}
.search::before{content:'⌕';position:absolute;left:13px;top:50%;transform:translateY(-52%);color:var(--dim);font-size:17px}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.14em;padding:9px 14px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.02);color:var(--mut);cursor:pointer;transition:all .2s;user-select:none}
.chip:hover{transform:translateY(-1px);border-color:var(--line2);color:var(--ink)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#141005;font-weight:600;box-shadow:0 4px 14px -6px rgba(232,196,107,.7)}
.toolmeta{margin-left:auto;display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim)}
.simdot{display:inline-flex;align-items:center;gap:6px}
.simdot i{width:7px;height:7px;border-radius:50%;background:var(--cyan);opacity:.35;transition:opacity .2s}
.simdot i.pulse{opacity:1;box-shadow:0 0 9px var(--cyan)}

/* watchlist table */
.wllist{overflow:visible}
.wl-head,.wl-row{display:grid;grid-template-columns:34px minmax(190px,1.8fr) 70px minmax(108px,1fr) 92px minmax(118px,1.05fr) 84px 86px;gap:10px;align-items:center;padding:11px 16px}
.wl-head{position:sticky;top:56px;z-index:6;background:rgba(9,15,12,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2);border-radius:14px 14px 0 0;font-family:var(--mono);font-size:9px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;padding-top:13px;padding-bottom:13px}
.wl-head span[data-sort]{cursor:pointer;transition:color .2s;user-select:none}
.wl-head span[data-sort]:hover{color:var(--gold)}
.wl-head span.s-on{color:var(--gold)}
.wl-row{border-bottom:1px solid var(--line);border-left:2px solid transparent;transition:background .2s,border-color .2s}
.wl-row:last-child{border-bottom:0}
.wl-row:hover{background:rgba(232,196,107,.045);border-left-color:var(--gold)}
.wl-row.locate{animation:locatePulse 1.4s ease 2}
@keyframes locatePulse{0%{box-shadow:inset 0 0 0 1px var(--gold);background:rgba(232,196,107,.1)}100%{box-shadow:inset 0 0 0 1px transparent}}
.star{background:none;border:0;cursor:pointer;font-size:16px;color:var(--dim);transition:transform .15s,color .2s;line-height:1}
.star:hover{transform:scale(1.25);color:var(--gold)}
.star.on{color:var(--gold);text-shadow:0 0 10px rgba(232,196,107,.8)}
.star:active{transform:scale(.8)}
.idcell .sy{font-family:var(--mono);font-weight:600;font-size:13.5px;letter-spacing:.04em}
.idcell .sy mark{background:rgba(232,196,107,.3);color:var(--ink);border-radius:2px;padding:0 1px}
.idcell .nm{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34ch}
.exb{font-family:var(--mono);font-size:9px;letter-spacing:.12em;padding:3px 8px;border-radius:4px;border:1px solid;justify-self:start}
.ex-NSE{color:var(--gold);border-color:rgba(232,196,107,.5)}
.ex-BSE{color:#e8965a;border-color:rgba(232,150,90,.5)}
.ex-US{color:var(--cyan);border-color:rgba(89,209,232,.5)}
.ex-OTHER{color:var(--mint);border-color:rgba(169,159,224,.5)}
.pc{font-family:var(--mono);font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums;border-radius:6px;padding:2px 6px;margin-left:-6px}
.pc.fu{animation:fu 1s ease} .pc.fd{animation:fd 1s ease}
@keyframes fu{0%{background:rgba(49,217,127,.3)}100%{background:transparent}}
@keyframes fd{0%{background:rgba(255,92,92,.3)}100%{background:transparent}}
.chg{font-family:var(--mono);font-size:11.5px;font-weight:500;padding:4px 9px;border-radius:6px;justify-self:start;font-variant-numeric:tabular-nums}
.chg.up{color:var(--up);background:rgba(49,217,127,.1)}
.chg.dn{color:var(--dn);background:rgba(255,92,92,.1)}
.sparksvg{width:100%;height:28px;display:block}
.sline{fill:none;stroke-width:1.6;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.3s ease .2s}
.rv.in .sline{stroke-dashoffset:0}
.sline.up{stroke:var(--up)} .sline.dn{stroke:var(--dn)}
.sarea.up{fill:rgba(49,217,127,.1)} .sarea.dn{fill:rgba(255,92,92,.1)}
.numc{font-family:var(--mono);font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.empty{padding:44px;text-align:center;color:var(--dim);font-family:var(--mono);font-size:12px;letter-spacing:.14em}

/* screener */
.weights{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.wt{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--cyan);border:1px solid rgba(89,209,232,.35);padding:5px 10px;border-radius:4px}
.sc-head{padding:18px 20px;margin-bottom:14px}
.sc-row{display:grid;grid-template-columns:52px minmax(180px,1.35fr) 78px minmax(240px,1.7fr) 90px 90px 66px;gap:14px;align-items:center;padding:15px 18px;border-bottom:1px solid var(--line);transition:background .2s}
.sc-row:hover{background:rgba(89,209,232,.04)}
.sc-row:last-child{border-bottom:0}
.rank{font-family:var(--disp);font-size:26px;color:var(--dim);text-align:center}
.sc-row:nth-child(-n+3) .rank{color:var(--gold)}
.dialw{position:relative;width:64px;height:64px}
.dial{width:64px;height:64px;transform:rotate(-90deg)}
.db{fill:none;stroke:rgba(255,255,255,.09);stroke-width:5}
.df{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;stroke-dasharray:0 1;transition:stroke-dasharray 1.3s cubic-bezier(.5,0,.2,1) .25s;filter:drop-shadow(0 0 4px rgba(232,196,107,.5))}
.dnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:15px;color:var(--gold)}
.sbars{display:flex;flex-direction:column;gap:7px}
.sbar{display:grid;grid-template-columns:86px 1fr 34px;gap:10px;align-items:center}
.sbar .sl{font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;color:var(--dim)}
.sbar .st{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.sbar .sf{height:100%;border-radius:3px;width:0;transition:width 1.1s cubic-bezier(.5,0,.2,1) .3s}
.sf.fT{background:var(--cyan)} .sf.fM{background:var(--gold)} .sf.fC{background:var(--mint)}
.sbar .sv{font-family:var(--mono);font-size:9.5px;color:var(--mut);text-align:right}

/* news */
.nw{display:grid;grid-template-columns:96px 1fr 180px;gap:18px;padding:17px 20px;border-bottom:1px solid var(--line);transition:background .2s,transform .2s}
.nw:hover{background:rgba(255,255,255,.028)}
.nw:last-child{border-bottom:0}
.age .a1{font-family:var(--mono);font-weight:600;font-size:23px;font-variant-numeric:tabular-nums}
.age.fresh .a1{color:var(--gold)} .age.stale .a1{color:var(--mut)}
.age .a2{font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;color:var(--dim)}
.nw-h{font-weight:600;font-size:15.5px;line-height:1.4;margin-bottom:8px}
.nw-m{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.06em}
.jchip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;padding:3px 10px;border-radius:14px;border:1px solid var(--line2);color:var(--ink);background:rgba(255,255,255,.03);cursor:pointer;transition:all .2s}
.jchip:hover{background:var(--gold);border-color:var(--gold);color:#141005;transform:translateY(-1px)}
.nw-metrics{display:flex;flex-direction:column;gap:7px;justify-content:center}
.mv{font-family:var(--mono);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.mv.up{color:var(--up)} .mv.dn{color:var(--dn)}
.sigline{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.1em}
.imp{display:grid;grid-template-columns:1fr 34px;gap:8px;align-items:center}
.imp .it{height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.imp .if{height:100%;border-radius:3px;width:0;transition:width 1.1s ease .3s}
.if.hi{background:var(--gold);box-shadow:0 0 8px rgba(232,196,107,.6)} .if.md{background:var(--cyan)} .if.lo{background:var(--dim)}
.imp .iv{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--ink);text-align:right}

/* pipeline */
.flow{display:flex;align-items:stretch;gap:0;margin:6px 0 22px}
.fnode{flex:1;padding:18px 20px;transition:transform .25s,border-color .25s}
.fnode:hover{transform:translateY(-3px);border-color:rgba(232,196,107,.4)}
.fnode .fi{font-size:22px;margin-bottom:8px}
.fnode h3{font-family:var(--disp);font-weight:400;font-size:16px;letter-spacing:.1em;margin-bottom:5px}
.fnode p{font-size:12px;color:var(--mut);line-height:1.55}
.fnode .ft{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:var(--cyan);margin-top:9px}
.fconn{width:56px;flex:none;position:relative;display:flex;align-items:center}
.fconn::before{content:'';position:absolute;left:6px;right:14px;top:50%;height:2px;
  background:repeating-linear-gradient(90deg,var(--gold) 0 7px,transparent 7px 15px);animation:dashMove 1.2s linear infinite}
.fconn::after{content:'▸';position:absolute;right:2px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:13px}
@keyframes dashMove{to{background-position:15px 0}}
.codecard{margin-bottom:18px;overflow:hidden}
.codehead{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line);background:rgba(0,0,0,.25)}
.codehead .fn{font-family:var(--mono);font-size:11.5px;color:var(--gold);letter-spacing:.06em}
.cpy{background:none;border:1px solid var(--line2);color:var(--mut);font-family:var(--mono);font-size:9px;letter-spacing:.14em;padding:5px 12px;border-radius:5px;cursor:pointer;transition:all .2s}
.cpy:hover{color:var(--gold);border-color:var(--gold)}
.codecard pre{font-family:var(--mono);font-size:11.8px;line-height:1.72;color:#c8d8ce;padding:16px 18px;overflow:auto;max-height:430px;background:rgba(3,7,5,.5)}
.codecard pre::-webkit-scrollbar{width:8px;height:8px}
.codecard pre::-webkit-scrollbar-thumb{background:var(--line2)}
.notes{padding:18px 22px}
.notes h3{font-family:var(--disp);font-weight:400;letter-spacing:.12em;font-size:15px;color:var(--gold);margin-bottom:10px}
.notes li{color:var(--mut);font-size:13px;margin:7px 0 7px 18px}
.notes li b{color:var(--ink)}

/* footer */
footer{border-top:1px solid var(--line);margin-top:34px;padding:28px 0 34px}
.disc{max-width:940px;margin:0 auto;text-align:center}
.disc .dl{font-family:var(--mono);font-size:9.5px;letter-spacing:.24em;color:var(--gold);margin-bottom:12px}
.disc p{font-size:12px;color:var(--dim);line-height:1.8}
.disc p b{color:var(--mut)}

/* reveal */
.rv{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease}
.rv.in{opacity:1;transform:none}

@media (max-width:1080px){
  .wl-head,.wl-row{grid-template-columns:34px minmax(170px,1.8fr) 70px minmax(104px,1fr) 92px minmax(110px,1.05fr) 84px}
  .c-mcap{display:none}
  .sc-row{grid-template-columns:48px minmax(160px,1.35fr) 74px minmax(220px,1.7fr) 88px}
  .sc-vol,.sc-ment{display:none}
}
@media (max-width:900px){
  .mast{grid-template-columns:1fr}
  .mastart{display:none}
  .wl-head,.wl-row{grid-template-columns:32px minmax(150px,1.8fr) 62px minmax(98px,1fr) 86px}
  .c-spark{display:none}
  .nw{grid-template-columns:1fr}
  .nw-metrics{flex-direction:row;align-items:center;gap:16px}
  .flow{flex-direction:column}
  .fconn{width:auto;height:44px;justify-content:center}
  .fconn::before{left:50%;right:auto;top:4px;bottom:12px;width:2px;height:auto;
    background:repeating-linear-gradient(180deg,var(--gold) 0 7px,transparent 7px 15px);animation:dashMoveV 1.2s linear infinite}
  .fconn::after{right:auto;bottom:0;top:auto;left:50%;transform:translateX(-50%) rotate(90deg)}
  @keyframes dashMoveV{to{background-position:0 15px}}
}
@media (max-width:640px){
  .wl-head,.wl-row{grid-template-columns:30px minmax(130px,1.8fr) 56px minmax(92px,1fr) 82px}
  .c-ex{display:none}
  .sc-row{grid-template-columns:40px 1fr 64px}
