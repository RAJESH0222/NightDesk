# .github/workflows/refresh.yml
# Zero-budget "backend": GitHub Actions cron -> JSON committed to the repo.
# No server, no database. Netlify serves the static page that reads it.
name: refresh-snapshot

on:
  schedule:
    # Cron is UTC. 03:30-10:00 UTC == 09:00-15:30 IST (NSE/BSE hours), Mon-Fri
    - cron: "*/15 3-10 * * 1-5"
    # 13:30-20:00 UTC == US regular session (EDT), Mon-Fri
    - cron: "*/15 13-20 * * 1-5"
    # 21:25 UTC daily == trailing-30d news-mention refresh after US close
    - cron: "25 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance requests
      - name: fetch snapshot
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          CRON: ${{ github.event.schedule }}
        run: |
          MODE=intraday
          if [ "$CRON" = "25 21 * * 1-5" ]; then MODE=daily; fi
          python scripts/fetch_snapshot.py --mode $MODE
      - name: commit snapshot
        run: |
          git config user.name  "nightdesk-bot"
          git config user.email "41898282+nightdesk-bot@users.noreply.github.com"
          git add data/snapshot.json
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%FT%TZ)"
          git push
